plugins { id 'com.android.application' }
def releaseVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def parts = releaseVersion.split('-')[0].tokenize('.').collect { it.toInteger() }
android {
    namespace 'com.aoki.zhongyutoolbox'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aoki.zhongyutoolbox'
        minSdk 26
        targetSdk 35
        versionCode parts[0] * 1000000 + parts[1] * 10000 + parts[2] * 100 + 1
        versionName releaseVersion
    }
    sourceSets { main { assets.srcDirs = ["${buildDir}/generated/web-assets"] } }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false }; debug { applicationIdSuffix '.qa'; versionNameSuffix '-qa' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0' }
