name: Build native Android APK
on:
  workflow_dispatch:
  pull_request:
    paths: ["native-android/**", "scripts/*android*", "src/**", "package*.json", ".github/workflows/android.yml", ".env.android", "vite.config.*"]
  push:
    branches: [main, feature/mobile-native-build-upstream]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run test:android
      - name: Build APK with temporary CI signing identity
        shell: bash
        run: |
          export ZYTB_GRADLE="$(command -v gradle)"
          npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: ZhongYuToolBox-native-Android-APK
          path: |
            release/android/*.apk
            release/android/*.txt
          if-no-files-found: error
          retention-days: 30
