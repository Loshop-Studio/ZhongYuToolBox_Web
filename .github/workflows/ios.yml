name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [feature/ios-liquid-glass-1.1.9]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:login
      - run: npm run test:update
      - run: npm run test:stats
      - run: npm run test:oss
      - run: npm run test:ios
      - run: npm run build:ios
      - name: Preserve fork IPA
        run: |
          mkdir -p release/ios-fork
          cp release/ios/*.{ipa,txt,md,json} release/ios-fork/
      - name: Build upstream iOS beta with original author statistics
        run: npm run build:ios
        env:
          VITE_RELEASE_REPOSITORY: Loshop-Studio/ZhongYuToolBox_Web
          VITE_AUTHOR_STATS: 'true'
      - name: Preserve upstream IPA
        run: |
          mkdir -p release/ios-upstream
          cp release/ios/*Loshop*.ipa release/ios-upstream/
          cp release/ios/*.{txt,md,json} release/ios-upstream/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZhongYuToolBox-iPhone-iPad-unsigned-IPA
          path: |
            release/ios-fork/
            release/ios-upstream/
          if-no-files-found: error
          retention-days: 30
  navigation:
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:ios -- --simulator --upload-qa
      - run: node scripts/test-ios-simulator.mjs
        env:
          IOS_TEST_DEVICE: ${{ matrix.device }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-navigation-test-evidence-${{ matrix.device }}
          path: |
            release/ios/test-evidence/*-attachments/
            release/ios/test-evidence/*.png
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iOS-failed-xcresults-${{ matrix.device }}
          path: release/ios/test-evidence/*.xcresult/
          if-no-files-found: warn
          retention-days: 30
